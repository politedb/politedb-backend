name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys against the server at once; queue the newer one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR }}
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_PORT }}
      SSH_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secret
        run: |
          cat > .env <<'EOF'
          ${{ secrets.APP_ENV_FILE }}
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package build artifact
        run: |
          mkdir -p release
          cp -R dist release/dist
          cp -R node_modules release/node_modules
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          cp -R scripts release/scripts
          cp ecosystem.config.cjs release/ecosystem.config.cjs
          tar \
            -czf release.tar.gz \
            -C release .

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            # Pinned host key: fails closed if the server key changes (MITM protection).
            printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set; trusting the host key on first use. Add the output of 'ssh-keyscan -p <port> <host>' as the VPS_KNOWN_HOSTS secret."
            ssh-keyscan -p "${SSH_PORT:-22}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -P "${SSH_PORT:-22}" release.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/politedb-backend-release-${GITHUB_SHA}.tar.gz"
          # Write the env file with owner-only permissions; scp would leave it world-readable in /tmp.
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "umask 077 && cat > '/tmp/politedb-backend-${GITHUB_SHA}.env'" < .env

      - name: Deploy on server
        run: |
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "
            set -euo pipefail
            INCOMING_DIR='${APP_DIR}/.deploy/incoming'
            rm -rf \"\$INCOMING_DIR\"
            mkdir -p \"\$INCOMING_DIR\"
            tar -xzf '/tmp/politedb-backend-release-${GITHUB_SHA}.tar.gz' -C \"\$INCOMING_DIR\"
            rm -f '/tmp/politedb-backend-release-${GITHUB_SHA}.tar.gz'
            APP_DIR='${APP_DIR}' \\
              INCOMING_DIR=\"\$INCOMING_DIR\" \\
              NEW_ENV_FILE='/tmp/politedb-backend-${GITHUB_SHA}.env' \\
              PM2_ECOSYSTEM_FILE='${PM2_ECOSYSTEM_FILE:-ecosystem.config.cjs}' \\
              bash \"\$INCOMING_DIR/scripts/remote-deploy.sh\"
          "
