name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR }}
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_PORT }}
      SSH_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secret
        run: |
          cat > .env <<'EOF'
          ${{ secrets.APP_ENV_FILE }}
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package build artifact
        run: |
          mkdir -p release
          cp -R dist release/dist
          cp -R node_modules release/node_modules
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          cp -R scripts release/scripts
          cp ecosystem.config.cjs release/ecosystem.config.cjs
          tar \
            -czf release.tar.gz \
            -C release .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -P "${SSH_PORT:-22}" release.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/politedb-backend-release.tar.gz"
          scp -P "${SSH_PORT:-22}" .env "${SSH_USER}@${SSH_HOST}:/tmp/politedb-backend.env"

      - name: Deploy on server
        run: |
          ssh -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "
            set -euo pipefail
            mkdir -p '${APP_DIR}'
            rm -rf '${APP_DIR}/dist' '${APP_DIR}/scripts' '${APP_DIR}/node_modules'
            tar -xzf /tmp/politedb-backend-release.tar.gz -C '${APP_DIR}'
            mv /tmp/politedb-backend.env '${APP_DIR}/.env'
            chmod 600 '${APP_DIR}/.env'
            chmod +x '${APP_DIR}/scripts/deploy-vps.sh'
            APP_DIR='${APP_DIR}' PM2_ECOSYSTEM_FILE='${PM2_ECOSYSTEM_FILE:-ecosystem.config.cjs}' bash '${APP_DIR}/scripts/deploy-vps.sh'
          "
