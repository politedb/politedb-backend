name: Deploy Render

# Pull requests: test and build the Docker image (no push).
# Pushes to main: test, push the image to GHCR, then point the Render image-backed service
# at that exact image digest through the deploy hook. Render Auto-Deploy must be off.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Disposable database for the migration tests (test/migrations.pg.test.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue deploys instead of cancelling one that is already running.
    concurrency:
      group: deploy-render
      cancel-in-progress: false

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          echo "Deploying ${IMAGE_REF}"
          # Pin the digest that was just built and tested. The hook URL holds a secret key,
          # so never print it.
          status="$(curl -sS -o response.json -w '%{http_code}' -X POST -G \
            --data-urlencode "imgURL=${IMAGE_REF}" \
            "${RENDER_DEPLOY_HOOK_URL}")"
          case "$status" in
            200) echo "Render deploy started: $(cat response.json)" ;;
            202) echo "Render queued this deploy behind one in progress" ;;
            *) echo "::error::Render deploy hook returned HTTP $status"; exit 1 ;;
          esac
